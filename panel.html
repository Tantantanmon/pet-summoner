<div class="pet-summoner-panel">
    <div class="ps-card">
        <div class="inline-drawer">
            <div class="inline-drawer-toggle inline-drawer-header ps-head ps-head-dog">
                <i class="fa-solid fa-dog"></i>
                <span class="ps-head-title">강아지</span>
                <label class="ps-active-radio">
                    <input type="radio" id="ps_active_dog" name="ps_active_pet" /> 활성
                </label>
                <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
            </div>
            <div class="inline-drawer-content ps-fields">
                <div class="ps-grid2">
                    <div class="ps-field"><label>이름</label><input id="ps_dog_name" type="text" class="text_pole" placeholder="예: 탄이" /></div>
                    <div class="ps-field"><label>나이</label><input id="ps_dog_age" type="text" class="text_pole" placeholder="예: 7살" /></div>
                    <div class="ps-field"><label>품종</label><input id="ps_dog_breed" type="text" class="text_pole" placeholder="예: 슈나우저 믹스" /></div>
                    <div class="ps-field"><label>크기 · 체형</label><input id="ps_dog_size" type="text" class="text_pole" placeholder="예: 소형" /></div>
                </div>
                <div class="ps-grid2">
                    <div class="ps-field"><label>좋아하는 것</label><textarea id="ps_dog_likes" class="text_pole" rows="2" placeholder="선택 입력"></textarea></div>
                    <div class="ps-field"><label>싫어하는 것</label><textarea id="ps_dog_dislikes" class="text_pole" rows="2" placeholder="선택 입력"></textarea></div>
                </div>
                <div class="ps-field"><label>버릇 · 습관</label><textarea id="ps_dog_habits" class="text_pole" rows="2" placeholder="선택 입력"></textarea></div>
                <div class="ps-grid2">
                    <div class="ps-field"><label>짖음 · 소리 스타일</label><input id="ps_dog_sound" type="text" class="text_pole" placeholder="선택 입력" /></div>
                    <div class="ps-field">
                        <label>에너지 레벨</label>
                        <select id="ps_dog_energy" class="text_pole">
                            <option value="">선택 안 함</option>
                            <option value="차분함">차분함</option>
                            <option value="보통">보통</option>
                            <option value="활발함">활발함</option>
                            <option value="매우 활발함">매우 활발함</option>
                        </select>
                    </div>
                </div>
                <div class="ps-field"><label>건강 상태 · 특이사항</label><textarea id="ps_dog_health" class="text_pole" rows="2" placeholder="선택 입력"></textarea></div>
                <div class="ps-field"><label>평소 루틴</label><textarea id="ps_dog_routine" class="text_pole" rows="2" placeholder="선택 입력"></textarea></div>
                <div class="ps-field">
                    <label>추억 에피소드</label>
                    <div id="ps_dog_episodes_list" class="ps-episode-list"></div>
                    <button id="ps_dog_episode_add" class="ps-add-btn" type="button"><i class="fa-solid fa-plus"></i> 추억 추가</button>
                </div>
            </div>
        </div>
    </div>

    <div class="ps-card">
        <div class="inline-drawer">
            <div class="inline-drawer-toggle inline-drawer-header ps-head ps-head-cat">
                <i class="fa-solid fa-cat"></i>
                <span class="ps-head-title">고양이</span>
                <label class="ps-active-radio">
                    <input type="radio" id="ps_active_cat" name="ps_active_pet" /> 활성
                </label>
                <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
            </div>
            <div class="inline-drawer-content ps-fields">
                <div class="ps-grid2">
                    <div class="ps-field"><label>이름</label><input id="ps_cat_name" type="text" class="text_pole" placeholder="예: 체셔" /></div>
                    <div class="ps-field"><label>나이</label><input id="ps_cat_age" type="text" class="text_pole" placeholder="예: 3살" /></div>
                    <div class="ps-field"><label>품종</label><input id="ps_cat_breed" type="text" class="text_pole" placeholder="선택 입력" /></div>
                    <div class="ps-field"><label>크기 · 체형</label><input id="ps_cat_size" type="text" class="text_pole" placeholder="선택 입력" /></div>
                </div>
                <div class="ps-grid2">
                    <div class="ps-field"><label>좋아하는 것</label><textarea id="ps_cat_likes" class="text_pole" rows="2" placeholder="선택 입력"></textarea></div>
                    <div class="ps-field"><label>싫어하는 것</label><textarea id="ps_cat_dislikes" class="text_pole" rows="2" placeholder="선택 입력"></textarea></div>
                </div>
                <div class="ps-field"><label>버릇 · 습관</label><textarea id="ps_cat_habits" class="text_pole" rows="2" placeholder="선택 입력"></textarea></div>
                <div class="ps-grid2">
                    <div class="ps-field"><label>울음 소리 스타일</label><input id="ps_cat_sound" type="text" class="text_pole" placeholder="선택 입력" /></div>
                    <div class="ps-field">
                        <label>에너지 레벨</label>
                        <select id="ps_cat_energy" class="text_pole">
                            <option value="">선택 안 함</option>
                            <option value="차분함">차분함</option>
                            <option value="보통">보통</option>
                            <option value="활발함">활발함</option>
                            <option value="매우 활발함">매우 활발함</option>
                        </select>
                    </div>
                </div>
                <div class="ps-field"><label>건강 상태 · 특이사항</label><textarea id="ps_cat_health" class="text_pole" rows="2" placeholder="선택 입력"></textarea></div>
                <div class="ps-field"><label>평소 루틴</label><textarea id="ps_cat_routine" class="text_pole" rows="2" placeholder="선택 입력"></textarea></div>
                <div class="ps-field">
                    <label>추억 에피소드</label>
                    <div id="ps_cat_episodes_list" class="ps-episode-list"></div>
                    <button id="ps_cat_episode_add" class="ps-add-btn" type="button"><i class="fa-solid fa-plus"></i> 추억 추가</button>
                </div>
            </div>
        </div>
    </div>

    <div class="ps-tagmanager">
        <p class="ps-section-title">태그 관리</p>

        <p class="ps-subtitle">상호작용 방식</p>
        <div id="ps_tagmgr_interaction" class="ps-pill-row"></div>
        <div class="ps-tag-add-row">
            <input id="ps_tagadd_interaction_input" type="text" class="text_pole" placeholder="+ 태그 추가" />
            <button id="ps_tagadd_interaction_btn" class="ps-add-btn" type="button"><i class="fa-solid fa-plus"></i></button>
        </div>

        <p class="ps-subtitle">함께하는 루틴</p>
        <div id="ps_tagmgr_routine" class="ps-pill-row"></div>
        <div class="ps-tag-add-row">
            <input id="ps_tagadd_routine_input" type="text" class="text_pole" placeholder="+ 태그 추가" />
            <button id="ps_tagadd_routine_btn" class="ps-add-btn" type="button"><i class="fa-solid fa-plus"></i></button>
        </div>
    </div>

    <label class="ps-checkbox-row" for="ps_oneshot">
        <input id="ps_oneshot" type="checkbox" />
        <span>입력창 버튼에서 태그 적용 후, 응답 1회만 반영하고 자동 해제</span>
    </label>
</div>
